# Blueprint de Render (AMD-002, DEC-12). Por ahora sólo el ambiente `pruebas`;
# `qa` y `main` se agregan al promover. Proyecto de práctica: planes gratuitos.
services:
  - type: web
    name: greenfield-pruebas
    runtime: docker
    plan: free
    branch: pruebas
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass # despliega sólo si la CI de GitHub pasa (T16)
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: greenfield-pruebas-db
          property: connectionString
      - key: AUTH_ISSUER # https://<host-keycloak>/realms/greenfield (docs/keycloak.md)
        sync: false
      - key: AUTH_JWKS_URL # <AUTH_ISSUER>/protocol/openid-connect/certs
        sync: false
      - key: AUTH_AUDIENCE
        value: greenfield-api
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: greenfield-pruebas-db
    plan: free
    databaseName: greenfield
    user: greenfield
    postgresMajorVersion: "18"
